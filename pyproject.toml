[project]
name = "vaquita"
version = "1.0.0"
description = "Dividí gastos con tu grupo y sabé quién le pasa cuánto a quién."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-playwright>=0.6",
    "axe-playwright-python>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el español usa ¿ ¡ « » y comillas tipográficas

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"e2e/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["vaquita.dominio.*", "vaquita.servicios.*"]
strict = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "axe_playwright_python.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.coverage.run]
source = ["vaquita"]
omit = ["vaquita/datos/migraciones/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
