# Blueprint de Render: la app y su base en el plan gratis.
# La base gratis de Render vence a los 30 días; para una base permanente, usá Neon
# (ver GUIA-DESPLIEGUE.md, "Pasar la base a Neon").
databases:
  - name: vaquita-db
    plan: free
    region: virginia
    databaseName: vaquita
    user: vaquita

services:
  - type: web
    name: vaquita
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Migra antes de arrancar. --proxy-headers: Render termina HTTPS en su proxy.
    startCommand: >-
      uv run alembic upgrade head &&
      uv run uvicorn vaquita.web.app:crear_app --factory
      --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: VAQUITA_ENTORNO
        value: produccion
      - key: VAQUITA_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vaquita-db
          property: connectionString
