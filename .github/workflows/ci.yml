name: CI

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy vaquita

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vaquita
          POSTGRES_PASSWORD: vaquita
          POSTGRES_DB: vaquita_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VAQUITA_TEST_DATABASE_URL: ${{ matrix.base == 'postgres' && 'postgresql+psycopg://vaquita:vaquita@localhost:5432/vaquita_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Tests con cobertura
        run: uv run pytest --cov=vaquita --cov-report=term-missing
      - name: Cobertura del dominio (mínimo 95 %)
        run: uv run coverage report --include="vaquita/dominio/*" --fail-under=95

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest e2e --browser chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trazas
          path: test-results/
